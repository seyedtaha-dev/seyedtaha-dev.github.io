<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0E1B">
  <title>ثبت نظر شما | سید طاها تقوی</title>
 
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
 
  <style>
    body.feedback-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px;
    }
 
    .fb-wrapper { width: 100%; max-width: 620px; }
    .fb-card {
      padding: 46px 42px 40px; text-align: center;
      background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-l);
      box-shadow: var(--shadow); animation: card-show 0.6s ease both;
    }
    @keyframes card-show { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
 
    .fb-card .brand-row { display: flex; justify-content: center; margin-bottom: 26px; }
    .fb-label { display: inline-block; margin-bottom: 8px; color: var(--blue-bright); font-size: 0.85rem; font-weight: 700; }
    .fb-card h1 { font-size: var(--step-3); font-weight: 800; line-height: 1.5; margin-bottom: 10px; }
    .fb-desc { max-width: 460px; margin: 0 auto 30px; color: var(--ink-soft); font-size: 0.92rem; }
 
    /* Star rating */
    .stars {
      display: flex; justify-content: center; gap: 6px; margin-bottom: 30px;
      direction: ltr;
    }
    .stars input { display: none; }
    .stars label {
      font-size: 2.4rem; line-height: 1; cursor: pointer; color: var(--line);
      transition: color 0.15s ease, transform 0.15s ease;
    }
    .stars input:checked ~ label { color: var(--amber, #E0A030); }
    .stars label:hover,
    .stars label:hover ~ label {
      color: var(--amber, #E0A030);
      transform: scale(1.08);
    }
 
    .rating-caption { margin-top: -14px; margin-bottom: 28px; font-size: 0.85rem; color: var(--ink-faint); min-height: 20px; }
 
    form.feedback-form { text-align: right; display: flex; flex-direction: column; gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--ink-soft); }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 13px 14px; border-radius: var(--radius-s); border: 1px solid var(--line);
      background: var(--paper); color: var(--ink); font-family: inherit; font-size: 0.92rem;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { outline: none; border-color: var(--blue-bright); }
    .form-group select { cursor: pointer; }
    .form-group textarea { resize: vertical; min-height: 110px; }
 
    .fb-submit {
      margin-top: 6px; padding: 15px; border-radius: var(--radius-s);
      background: var(--blue); color: #fff; font-weight: 800; font-size: 1rem; border: none;
      cursor: pointer; transition: background 0.2s ease, opacity 0.2s ease;
    }
    .fb-submit:hover { background: var(--blue-bright); }
    .fb-submit:disabled { cursor: wait; opacity: 0.7; }
 
    .fb-privacy-note { margin-top: 4px; text-align: center; font-size: 0.8rem; color: var(--ink-faint); line-height: 1.8; }
 
    .fb-back { display: inline-block; margin-top: 26px; font-size: 0.85rem; color: var(--ink-faint); }
    .fb-back:hover { color: var(--blue-bright); }
 
    #confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 20; }
    .confetti-piece {
      position: absolute; top: -30px; width: 8px; height: 15px; border-radius: 2px; opacity: 0;
      animation: confetti-fall linear forwards;
    }
    .confetti-piece:nth-child(5n) { background: var(--blue); }
    .confetti-piece:nth-child(5n + 1) { background: var(--blue-bright); }
    .confetti-piece:nth-child(5n + 2) { background: var(--amber); }
    .confetti-piece:nth-child(5n + 3) { background: var(--success); }
    .confetti-piece:nth-child(5n + 4) { background: #EC4899; }
    @keyframes confetti-fall {
      0% { top: -30px; opacity: 1; transform: translateX(0) rotate(0deg); }
      70% { opacity: 1; }
      100% { top: 110vh; opacity: 0; transform: translateX(var(--move-x)) rotate(720deg); }
    }
 
    @media (max-width: 600px) {
      .fb-card { padding: 32px 22px 28px; }
      .stars label { font-size: 2rem; }
    }
  </style>
</head>
 
<body class="feedback-page">
 
  <div id="confetti"></div>
 
  <main class="fb-wrapper">
    <section class="fb-card">
 
      <div class="brand-row">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" style="width:52px;height:52px">
          <rect width="64" height="64" rx="16" fill="#1F3E7A"/>
          <path d="M20 18h24l-4 8h-8l-4 26h-8l4-26h-8z" fill="#F6F7FB"/>
          <path d="M14 44c8 0 8-6 0-9s-8-9 0-9" fill="none" stroke="#3D7EFF" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
 
      <span class="fb-label">نظر شما برام مهمه</span>
      <h1>تجربه‌ات از پروژه چطور بود؟</h1>
      <p class="fb-desc">چند دقیقه وقت بذار و نظرت رو درباره سایت یا پروژه‌ای که برات انجام دادم بگو — کمک می‌کنه بهتر بشم.</p>
 
      <form class="feedback-form" id="feedbackForm" action="https://formspree.io/f/xzebkqdd" method="POST">
        <input type="hidden" name="_subject" value="نظر جدید درباره پروژه - سید طاها تقوی">
 
        <div class="stars" id="starRating">
          <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="عالی">★</label>
          <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="خوب">★</label>
          <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="متوسط">★</label>
          <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="ضعیف">★</label>
          <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="خیلی ضعیف">★</label>
        </div>
        <div class="rating-caption" id="ratingCaption"></div>
 
        <div class="form-group">
          <label for="fbName">اسم و نام‌خانوادگی</label>
          <input type="text" id="fbName" name="name" placeholder="مثلاً: رضا احمدی" required>
        </div>
 
        <div class="form-group">
          <label for="fbPhone">شماره تماس</label>
          <input type="tel" id="fbPhone" name="phone" placeholder="مثلاً: 09123456789" pattern="^(09\d{9}|\+989\d{9})$" required>
        </div>
 
        <div class="form-group">
          <label for="fbProject">نظرت درباره چیه؟</label>
          <select id="fbProject" name="project" required>
            <option value="" disabled selected>انتخاب کن...</option>
            <option value="خود سایت">خود سایت</option>
            <option value="پروژه‌ای که برام انجام دادید">پروژه‌ای که برام انجام دادید</option>
          </select>
        </div>
 
        <div class="form-group">
          <label for="fbComment">نظرت رو بنویس</label>
          <textarea id="fbComment" name="comment" placeholder="از کار و نتیجه‌ی نهایی راضی بودی؟ چی خوب بود، چی می‌شد بهتر باشه؟" required></textarea>
        </div>
 
        <button type="submit" class="fb-submit">ارسال نظر</button>
        <p class="fb-privacy-note">🔒 نظر شما فقط برای بهبود کیفیت کار استفاده می‌شه و بدون اجازه‌تون جایی منتشر نمی‌شه.</p>
      </form>
 
      <a href="index.html" class="fb-back">بازگشت به سایت</a>
 
    </section>
  </main>
 
  <script>
    function launchConfetti() {
      const confetti = document.getElementById("confetti");
      const count = 90;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "%";
        piece.style.animationDelay = Math.random() * 1.5 + "s";
        piece.style.animationDuration = 3.5 + Math.random() * 2.5 + "s";
        piece.style.setProperty("--move-x", (Math.random() * 260 - 130) + "px");
        piece.style.width = 6 + Math.random() * 7 + "px";
        piece.style.height = 10 + Math.random() * 12 + "px";
        confetti.appendChild(piece);
      }
    }
 
    const form = document.getElementById("feedbackForm");
    const caption = document.getElementById("ratingCaption");
    const captions = { "1": "خیلی ضعیف 😕", "2": "ضعیف 🙁", "3": "متوسط 🙂", "4": "خوب 😊", "5": "عالی 🤩" };
 
    document.querySelectorAll('input[name="rating"]').forEach(input => {
      input.addEventListener("change", () => {
        caption.textContent = captions[input.value] || "";
      });
    });
 
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submitBtn = form.querySelector(".fb-submit");
      const originalText = submitBtn.innerHTML;
 
      if (!form.action || form.action.includes("YOUR_FEEDBACK_FORM_ID")) {
        alert("آدرس فرم Formspree هنوز تنظیم نشده. لطفاً اول یه فرم تو formspree.io بسازید و آدرسش رو جایگزین کنید.");
        return;
      }
 
      submitBtn.disabled = true;
      submitBtn.innerHTML = "⏳ در حال ارسال...";
 
      try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
          headers: { Accept: "application/json" }
        });
 
        if (!response.ok) throw new Error("ارسال ناموفق بود");
 
        form.innerHTML = `
          <div style="text-align:center; padding: 20px 0;">
            <div style="font-size:2.6rem; margin-bottom:16px;">🎉</div>
            <strong style="display:block; font-size:1.15rem; margin-bottom:10px;">ممنون که وقت گذاشتی!</strong>
            <span style="color:var(--ink-soft); font-size:0.92rem; line-height:1.9; display:block; max-width:38ch; margin:0 auto;">
              نظرت با موفقیت ثبت شد. هر نظری، چه تعریف چه انتقاد، کمکم می‌کنه کارم رو بهتر انجام بدم. 🙏
            </span>
          </div>`;
        launchConfetti();
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
        alert("ارسال نظر انجام نشد. لطفاً دوباره امتحان کن.");
      }
    });
  </script>
 
</body>
</html>
